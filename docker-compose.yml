services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventum-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventum-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  users-db:
    image: postgres:16
    container_name: eventum-users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16
    container_name: eventum-events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16
    container_name: eventum-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eventapi-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: eventapi-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: eventapi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

  users-api:
    build:
      context: .
      dockerfile: Eventum.Users.WebApi/Dockerfile
    container_name: eventum-users-api
    depends_on:
      users-db:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UsersConnection: Host=users-db;Port=5432;Database=users;Username=postgres;Password=postgres
      JwtSettings__Secret: your-super-secret-key-here-and-it-should-be-more-than-256-bit
      JwtSettings__Issuer: Eventum
      JwtSettings__Audience: Eventum
      JwtSettings__ExpirationMinutes: 15
      ServiceName: users-service
      Otlp__Endpoint: http://jaeger:4317
    networks:
      default:
        aliases:
          - users-service

  events-api:
    build:
      context: .
      dockerfile: Eventum.Events.WebApi/Dockerfile
    container_name: eventum-events-api
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EventsConnection: Host=events-db;Port=5432;Database=events;Username=postgres;Password=postgres
      JwtSettings__Secret: your-super-secret-key-here-and-it-should-be-more-than-256-bit
      JwtSettings__Issuer: Eventum
      JwtSettings__Audience: Eventum
      JwtSettings__ExpirationMinutes: 15
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: eventum-events
      Redis__ConnectionString: redis:6379
      Redis__EventTtlSeconds: 300
      Redis__TopEventsTtlSeconds: 60
      ServiceName: events-service
      Otlp__Endpoint: http://jaeger:4317
    networks:
      default:
        aliases:
          - events-service

  bookings-api:
    build:
      context: .
      dockerfile: Eventum.Bookings.WebApi/Dockerfile
    container_name: eventum-bookings-api
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BookingsConnection: Host=bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres
      JwtSettings__Secret: your-super-secret-key-here-and-it-should-be-more-than-256-bit
      JwtSettings__Issuer: Eventum
      JwtSettings__Audience: Eventum
      JwtSettings__ExpirationMinutes: 15
      Kafka__BootstrapServers: kafka:29092
      ServiceName: bookings-service
      Otlp__Endpoint: http://jaeger:4317
    networks:
      default:
        aliases:
          - bookings-service

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
  grafana-data:
